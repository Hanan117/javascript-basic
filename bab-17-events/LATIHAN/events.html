<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pemesanan Tiket Bioskop</title>
    <!-- Menghubungkan ke CSS -->
    <link rel="stylesheet" href="events.css" />
  </head>
  <body>
    <div class="container">
      <h1>🎬 Bioskop XXI</h1>

      <!-- Area 1: Form Pemesanan -->
      <div class="card">
        <h2>📝 Form Pemesanan</h2>
        <div id="errorAlert" class="error-msg">
          ⚠️ Nama, email, dan judul film wajib diisi!
        </div>

        <form id="bookingForm">
          <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" placeholder="Masukkan nama Anda" />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="nama@email.com" />
          </div>
          <div class="form-group">
            <label for="film">Judul Film</label>
            <input type="text" id="film" placeholder="Masukkan judul film" />
          </div>
          <div class="btn-container">
            <button type="submit" class="btn-submit">Pesan Tiket</button>
            <button type="button" id="resetBtn" class="btn-reset">
              Reset Form
            </button>
          </div>
        </form>
      </div>

      <!-- Area 2: Daftar Pesanan -->
      <div class="card">
        <h2>🎫 Daftar Pesanan</h2>
        <div id="ticketListContainer">
          <p class="empty-state">Belum ada tiket yang dipesan.</p>
        </div>
      </div>
    </div>

    <!-- Menghubungkan ke JavaScript -->
    <script src="events.js"></script>
  </body>
</html>
