<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kasir Sederhana</title>
    <link rel="stylesheet" href="kasir.css">
</head>
<body>

    <div class="container">
        <h1>Aplikasi Kasir Sederhana</h1>
        
        <div class="card">
            <h2>Daftar Produk</h2>
            <div id="daftar-produk" class="output-box"></div>
        </div>

        <div class="card">
            <h2>Struk Transaksi (Simulasi 1 Produk)</h2>
            <div id="struk-transaksi" class="output-box"></div>
        </div>

        <div class="card">
            <h2>Struk Transaksi (Simulasi Banyak Produk / Total)</h2>
            <div id="struk-total" class="output-box"></div>
        </div>
    </div>

    
    <script type="module" src="kasir.js/app.js"></script>
</body>
</html>
